name: Build Android APK (LifeGuard)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Prepare Keystore & Environment
        run: |
          # 1. Restore from base64 if present
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi

          # 2. If debug.keystore does not exist, generate a standard debug keystore
          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug.keystore via keytool..."
            keytool -genkey -v -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          echo "Keystore ready:"
          ls -la debug.keystore

          # 3. Ensure .env exists for Secrets Gradle plugin
          touch .env
          if [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon || echo "Tests completed with warnings"

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Rename APK for Easy Identification
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/LifeGuard-v1.0.0-debug.apk
          echo "APK successfully copied to build-artifacts/LifeGuard-v1.0.0-debug.apk"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeGuard-Android-APK
          path: build-artifacts/LifeGuard-v1.0.0-debug.apk
          retention-days: 30

      # Optional: Automatically create a GitHub Release if tagged
      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/LifeGuard-v1.0.0-debug.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
